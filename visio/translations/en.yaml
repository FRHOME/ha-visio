configuration:
  instance_name:
    name: Name of this Home Assistant
    description: How the other instances see this one (e.g. Paris, Toulouse, Grandparents).
  peer_url:
    name: Peer address of this Home Assistant
    description: "Address the other instances use to reach this one, e.g. http://192.168.1.10:8100. Pre-filled when you create an invitation if left empty."
  ring_duration:
    name: Ring duration (seconds)
  ice_servers:
    name: STUN/TURN servers
    description: Optional. Between sites linked by a VPN (UniFi Site Magic…) none is needed.
  turn_username:
    name: TURN username
  turn_password:
    name: TURN password
  log_level:
    name: Log level
network:
  8100/tcp: Peer link with the other Home Assistant instances
