configuration:
  instance_name:
    name: Nom de ce Home Assistant
    description: Comment les autres instances voient celle-ci (ex. Paris, Toulouse, Papi Mamie).
  peer_url:
    name: Adresse pair de ce Home Assistant
    description: "Adresse par laquelle les autres instances joignent celle-ci, ex. http://192.168.1.10:8100. Proposée automatiquement à la création d'une invitation si vide."
  ring_duration:
    name: Durée de sonnerie (secondes)
  ice_servers:
    name: Serveurs STUN/TURN
    description: Facultatif. Entre deux sites reliés par un VPN (UniFi Site Magic…), aucun n'est nécessaire.
  turn_username:
    name: Utilisateur TURN
  turn_password:
    name: Mot de passe TURN
  log_level:
    name: Niveau de journalisation
  install_card:
    name: Intégration aux dashboards
    description: "Installe la carte HA Visio et le bandeau d'appel entrant sur tous les dashboards (copie ha-visio.js dans /config/www et l'enregistre comme ressource)."
network:
  8100/tcp: Lien pair avec les autres instances Home Assistant
