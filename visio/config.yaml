name: HA Visio
version: "0.3.0"
slug: visio
description: Video calls between Home Assistant instances, on any screen — no app to install
url: https://github.com/FRHOME/ha-visio
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:phone-in-talk
panel_title: Visio
panel_admin: false
homeassistant_api: true
hassio_api: true
map:
  - homeassistant_config:rw
ports:
  8100/tcp: 8100
ports_description:
  8100/tcp: Peer link with the other Home Assistant instances
options:
  instance_name: Home
  peer_url: ""
  ring_duration: 45
  ice_servers:
    - "stun:stun.l.google.com:19302"
  turn_username: ""
  turn_password: ""
  log_level: info
  install_card: true
schema:
  instance_name: str
  peer_url: str?
  ring_duration: int(15,180)
  ice_servers:
    - str
  turn_username: str?
  turn_password: password?
  log_level: list(debug|info|warning|error)
  install_card: bool
