name: Visio
version: "0.1.0"
slug: visio
description: Appel vidéo d'un clic vers une tablette murale, directement dans Home Assistant
url: https://github.com/CHANGE_ME/ha-visio
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:phone-in-talk
panel_title: Visio
panel_admin: false
homeassistant_api: true
hassio_api: true
options:
  device_name: Tablette
  device_user_agent: ""
  device_users: []
  device_ha_url: ""
  open_service: ""
  close_service: ""
  return_button: ""
  turn_off_during_call: []
  turn_on_during_call: []
  ring_duration: 45
  ice_servers:
    - "stun:stun.l.google.com:19302"
  turn_username: ""
  turn_password: ""
schema:
  device_name: str
  device_user_agent: str
  device_users:
    - str
  device_ha_url: str
  open_service: str
  close_service: str
  return_button: str
  turn_off_during_call:
    - str
  turn_on_during_call:
    - str
  ring_duration: int(15,180)
  ice_servers:
    - str
  turn_username: str
  turn_password: password
